<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B CRM - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="logo">
            <h1>Company CRM</h1>
        </div>
        <nav id="main-nav">
            <ul>
                <li><a href="index.html" aria-current="page">Dashboard</a></li>
                <li><a href="leads.html">Leads</a></li>
                <li><a href="contacts.html">Contacts</a></li>
                <li><a href="analytics.html">Analytics</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </nav>
        <button id="menu-toggle" aria-label="Toggle menu">☰</button>
        <div class="user-menu">
            <button id="user-toggle">User Profile</button>
            <div id="user-dropdown" class="hidden">
                <a href="#">Profile</a>
                <a href="#">Logout</a>
            </div>
        </div>
    </header>

    <aside id="sidebar">
        <nav>
            <ul>
                <li><a href="index.html" aria-current="page">Dashboard</a></li>
                <li><a href="leads.html">Leads</a></li>
                <li><a href="contacts.html">Contacts</a></li>
                <li><a href="analytics.html">Analytics</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </nav>
    </aside>

    <main>
        <section id="dashboard">
            <h2>Dashboard Overview</h2>
            <div class="stats">
                <div class="stat-card">
                    <h3>Total Leads</h3>
                    <p id="total-leads">0</p>
                </div>
                <div class="stat-card">
                    <h3>Active Deals</h3>
                    <p id="active-deals">0</p>
                </div>
                <div class="stat-card">
                    <h3>Revenue Forecast</h3>
                    <p id="revenue-forecast">$0</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 Generic B2B CRM. Built for scalability across companies.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
