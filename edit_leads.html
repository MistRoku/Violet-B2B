<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VioletCRM - Edit Lead</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="edit-container">
        <section id="edit-lead">
            <h2>Edit Lead</h2>
            <form id="edit-lead-form">
                <input type="hidden" id="lead-id">
                <label for="edit-lead-name">Name:</label>
                <input type="text" id="edit-lead-name" required>
                <label for="edit-lead-email">Email:</label>
                <input type="email" id="edit-lead-email" required>
                <label for="edit-lead-company">Company:</label>
                <input type="text" id="edit-lead-company" required>
                <button type="submit">Update Lead</button>
            </form>
            <p id="edit-message"></p>
            <a href="leads.html">Back to Leads</a>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
