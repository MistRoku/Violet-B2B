<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B CRM - Settings</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="logo">
            <h1>Company CRM</h1>
        </div>
        <nav id="main-nav">
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="leads.html">Leads</a></li>
                <li><a href="contacts.html">Contacts</a></li>
                <li><a href="analytics.html">Analytics</a></li>
                <li><a href="settings.html" aria-current="page">Settings</a></li>
            </ul>
        </nav>
        <button id="menu-toggle" aria-label="Toggle menu">☰</button>
        <div class="user-menu">
            <button id="user-toggle">User Profile</button>
            <div id="user-dropdown" class="hidden">
                <a href="#">Profile</a>
                <a href="#">Logout</a>
            </div>
        </div>
    </header>

    <aside id="sidebar">
        <nav>
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="leads.html">Leads</a></li>
                <li><a href="contacts.html">Contacts</a></li>
                <li><a href="analytics.html">Analytics</a></li>
                <li><a href="settings.html" aria-current="page">Settings</a></li>
            </ul>
        </nav>
    </aside>

    <main>
        <section id="settings">
            <h2>Settings</h2>
            <form id="settings-form">
                <label for="theme">Theme:</label>
                <select id="theme">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
                <button type="submit">Save</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 Generic B2B CRM. Built for scalability across companies.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
