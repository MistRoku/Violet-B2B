<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VioletCRM - Manage Businesses</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>VioletCRM</h1>
        </div>
        <nav id="main-nav">
            <ul>
                <li><a href="admin-dashboard.html">Dashboard</a></li>
                <li><a href="manage-businesses.html" aria-current="page">Manage Businesses</a></li>
                <li><a href="leads.html">Leads</a></li>
                <li><a href="contacts.html">Contacts</a></li>
                <li><a href="analytics.html">Analytics</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </nav>
        <button id="menu-toggle" aria-label="Toggle menu">☰</button>
        <div class="user-menu">
            <button id="user-toggle">Admin Profile</button>
            <div id="user-dropdown" class="hidden">
                <a href="#" id="logout">Logout</a>
            </div>
        </div>
    </header>

    <aside id="sidebar">
        <nav>
            <ul>
                <li><a href="admin-dashboard.html">Dashboard</a></li>
                <li><a href="manage-businesses.html" aria-current="page">Manage Businesses</a></li>
                <li><a href="leads.html">Leads</a></li>
                <li><a href="contacts.html">Contacts</a></li>
                <li><a href="analytics.html">Analytics</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </nav>
    </aside>

    <main>
        <section id="manage-businesses">
            <h2>Manage Business Profiles</h2>
            <form id="business-form">
                <input type="text" id="business-name" placeholder="Business Name" required>
                <input type="text" id="business-industry" placeholder="Industry" required>
                <input type="email" id="business-email" placeholder="Contact Email" required>
                <input type="text" id="business-phone" placeholder="Phone" required>
                <button type="submit">Add Business</button>
            </form>
            <input type="text" id="business-search" placeholder="Search businesses...">
            <ul id="business-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 VioletCRM. Built for scalability across companies.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
